services:

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile

    container_name: telco-ai-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine

    container_name: telco-ai-postgres

    environment:
      POSTGRES_DB: telco_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d telco_ai"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: telco-ai-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped


volumes:
  postgres_data:
  redis_data: