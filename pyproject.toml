[project]
name = "telco-ai-operations-assistant"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "langchain",
    "langchain-openai",
    "langgraph",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pytest-cov",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = [
    "agents*",
    "apps*",
    "rag*",
    "prompts*",
    "tools*",
]
exclude = [
    "infrastructure*",
    "tests*",
]