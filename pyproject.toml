[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-ai-operations-assistant"
version = "1.0.0"
description = "Multi-agent AI operations assistant for telecom: LangGraph, MCP, hybrid RAG, human-in-the-loop approvals and evals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "mcp>=2.3",
    "numpy>=2.0",
    "pypdf>=5.0",
    "pyjwt>=2.9",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
]
openai = ["langchain-openai>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]
rerank = ["sentence-transformers>=3.0"]
media = ["pillow>=10.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
telco-ingest = "rag.ingest:main"
telco-mcp = "apps.mcp_server.__main__:main"
telco-evals = "evals.run:main"

[tool.setuptools.packages.find]
include = [
    "agents*",
    "apps*",
    "core*",
    "evals*",
    "llm*",
    "observability*",
    "prompts*",
    "rag*",
    "security*",
    "services*",
    "storage*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["apps/frontend", "build", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "postgres: requires a running Postgres with pgvector (DATABASE_URL)",
]

[tool.coverage.run]
source = ["agents", "core", "apps/api", "apps/mcp_server", "llm", "rag", "security", "services", "storage", "observability"]
omit = ["apps/frontend/*"]

[tool.coverage.report]
skip_empty = true
