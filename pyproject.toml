[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-ai-operations-assistant"
version = "0.1.0"
description = "Enterprise Agentic AI platform for telecommunications operations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",

    # AI / LLM
    "openai>=1.50,<2.0",
    "langchain>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "langgraph>=0.2,<1.0",

    # MCP
    "mcp>=1.0,<2.0",

    # Database
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",

    # Redis
    "redis>=5.0,<6.0",

    # HTTP
    "httpx>=0.27,<1.0",

    # Observability
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",

    # Security
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[tool.setuptools.packages.find]
include = [
    "apps*",
    "agents*",
    "rag*",
    "tools*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true