name: Deploy

on:
  workflow_run:
    workflows:
      - Docker
    types:
      - completed

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ secrets.AZURE_CONTAINER_APP }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: telco-ai-api

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Deployment smoke test
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "Running deployment smoke test..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            "${APP_URL}/health"

      - name: Deployment summary
        run: |
          echo "======================================"
          echo "TelcoAI deployment successful"
          echo "======================================"
          echo "Environment: production"
          echo "Resource Group: $AZURE_RESOURCE_GROUP"
          echo "Container App: $AZURE_CONTAINER_APP"