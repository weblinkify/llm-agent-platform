name: Deploy to Azure

# Manual only: provision with infrastructure/terraform first, then set the
# AZURE_* secrets (OIDC federated credentials) and ACR_LOGIN_SERVER.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push to ACR
        run: |
          az acr login --name "${{ secrets.ACR_LOGIN_SERVER }}"
          docker build -f infrastructure/docker/Dockerfile -t "${{ secrets.ACR_LOGIN_SERVER }}/telco-ai-api:${{ inputs.image_tag }}" .
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/telco-ai-api:${{ inputs.image_tag }}"
      - name: Roll out Container Apps
        run: |
          for app in mcp api; do
            az containerapp update --name "ca-${app}-${{ secrets.AZURE_NAME_SUFFIX }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/telco-ai-api:${{ inputs.image_tag }}"
          done
      - name: Smoke test
        run: curl --fail --retry 10 --retry-delay 6 "${{ secrets.APP_URL }}/health"
