name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,postgres,openai,anthropic]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telco_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telco_ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,postgres,openai,anthropic]"
      - name: pytest (coverage gate 85%)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Test coverage: {rate:.1f}%")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  evals:
    name: AI evals (mock, regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m evals.run --check --output "$RUNNER_TEMP"
      - name: Publish results
        if: always()
        run: cat "$RUNNER_TEMP/results.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: ${{ runner.temp }}/results.*

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Browser e2e (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: pip install -e .
      - name: Start API (mock mode)
        run: |
          nohup uvicorn apps.api.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && break; sleep 1; done
      - name: Build and start web
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build
          nohup npm run start > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000 >/dev/null && break; sleep 1; done
      - name: Install browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: apps/frontend
        run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report
            api.log

  docker:
    name: Docker stack, smoke test & Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the full stack (no .env, no keys)
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf localhost:3000/api/ready && break
            sleep 3
          done
      - name: Smoke test through the web proxy
        run: python3 scripts/smoke_test.py http://localhost:3000/api
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Trivy image scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: telco-ai-api:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
